<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboards – 5 domains</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--track:#e8edf5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070b;--card:#0c1017;--ink:#f1f5f9;--mut:#8b97a8;--line:#1c2430;--track:#1c2430;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05070b;--card:#0c1017;--ink:#f1f5f9;--mut:#8b97a8;--line:#1c2430;--track:#1c2430;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px}
.bar{display:flex;gap:8px;align-items:center;padding:14px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
.bar h1{font-size:16px;margin:0 12px 0 0}
.tab,.th{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:9px;padding:8px 14px;font:600 13px Inter,sans-serif;cursor:pointer}
.tab.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
.th{margin-left:auto}
.tab:focus-visible,.th:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
main{max-width:1300px;margin:0 auto;padding:16px 20px 40px}
html,body{overflow-x:hidden;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600}
.k{display:flex;flex-direction:column;gap:2px}
.k .l{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:8px}
.k .l i{width:10px;height:10px;border-radius:50%}
.k b{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.k .d{font-size:12px;font-weight:600}.k .d span{color:var(--mut);font-weight:400}
.up{color:#22c55e}.dn{color:#ef4444}
svg{display:block;width:100%;height:auto}
.dn2{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dn2 svg{width:170px;flex:none}
.lg{flex:1;min-width:150px}
.lg div{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.lg div:last-child{border:0}
.lg i{width:9px;height:9px;border-radius:50%}
.lg b{margin-left:auto;font-weight:600}
.hb{display:flex;flex-direction:column;gap:12px}
.hb div{display:grid;grid-template-columns:96px 1fr 58px;gap:10px;align-items:center;font-size:13px}
.tr{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.tr u{display:block;height:100%;border-radius:99px;text-decoration:none}
.hb b{text-align:right;font-weight:600}
.gl{display:flex;flex-direction:column;gap:16px}
.gl p{margin:0 0 6px;display:flex;justify-content:space-between;font-size:13px;gap:8px}
.gl p span{color:var(--mut)}
.gl p b{font-weight:700}
.note{color:var(--mut);font-size:12px;margin-top:10px}
.card{transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(15,23,42,.12);border-color:#93c5fd}
.view-enter .card{animation:card-in .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.view-enter .kpis .card{animation-name:kpi-in}
.view-enter .g>.card{animation-name:panel-in}
.view-enter .g>.card:nth-child(1){animation-delay:220ms}.view-enter .g>.card:nth-child(2){animation-delay:280ms}.view-enter .g>.card:nth-child(3){animation-delay:340ms}.view-enter .g>.card:nth-child(4){animation-delay:400ms}.view-enter .g>.card:nth-child(5){animation-delay:460ms}
.k-count{font-variant-numeric:tabular-nums}
.draw-line{stroke-dasharray:var(--line-length);stroke-dashoffset:var(--line-length);animation:line-draw 1.2s cubic-bezier(.2,.8,.2,1) .18s forwards}
.area-fade{opacity:0;animation:area-fade .55s ease-out 1s forwards}
.chart-point{opacity:0;cursor:crosshair;transition:r .2s ease,opacity .2s ease}
.chart-point.is-visible{opacity:1}
.chart-point:hover{r:7;filter:drop-shadow(0 0 4px currentColor)}
.bar-grow{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);animation:bar-grow .75s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--bar-delay,0ms)}
.hb .tr u,.gl .tr u{width:0!important;transition:width .85s cubic-bezier(.2,.8,.2,1);transition-delay:var(--bar-delay,0ms)}
.hb .tr u.is-filled,.gl .tr u.is-filled{width:var(--target-width)!important}
.donut-segment{stroke-dasharray:0 var(--circumference);animation:donut-sweep .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--donut-delay,0ms)}
.donut-total{font-variant-numeric:tabular-nums}
@keyframes card-in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes kpi-in{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes panel-in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes line-draw{to{stroke-dashoffset:0}}
@keyframes area-fade{to{opacity:1}}
@keyframes bar-grow{to{transform:scaleY(1)}}
@keyframes donut-sweep{to{stroke-dasharray:var(--segment-length) var(--circumference)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.view-enter .card{opacity:1;transform:none}.draw-line{stroke-dashoffset:0}.area-fade{opacity:1}.bar-grow{transform:scaleY(1)}.chart-point{opacity:1}.hb .tr u,.gl .tr u{width:var(--target-width)!important}.donut-segment{stroke-dasharray:var(--segment-length) var(--circumference)}}
.dashboard-main{touch-action:pan-y;user-select:none;cursor:none;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.dashboard-main.is-dragging{cursor:none;transition:none}
.drag-badge{position:fixed;z-index:50;width:78px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid #3c1d8f;border-radius:50%;background:#281267;color:#fff;font:600 13px/1 Inter,sans-serif;pointer-events:none;opacity:0;transform:translate(18px,18px) scale(.92);transition:opacity .18s ease,transform .18s ease}
.drag-badge .drag-hand{width:24px;height:24px;display:block}
.drag-badge .drag-hand path{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}
.drag-badge.is-visible{opacity:1;transform:translate(18px,18px) scale(1)}
.drag-badge.is-dragging{transform:translate(18px,18px) scale(.85)}
.dashboard-caption{display:flex;align-items:baseline;justify-content:center;gap:9px;margin:20px auto 10px;opacity:1;transition:opacity .3s ease;text-align:center}
.dashboard-caption.is-changing{opacity:0}
.dashboard-caption .caption-icon{color:#3b82f6;font-size:20px;font-weight:700}
.dashboard-caption strong{font-size:17px;color:var(--ink)}
.dashboard-caption span:last-child{font-size:14px;color:#8b97a8}
.dashboard-progress{display:flex;justify-content:center;gap:8px;margin:0 auto 4px}
.progress-dot{position:relative;width:34px;height:5px;padding:0;border:0;border-radius:99px;background:#1c2430;overflow:hidden;cursor:pointer}
.progress-dot:focus-visible{outline:3px solid #60a5fa;outline-offset:4px}
.progress-dot:after{content:"";position:absolute;inset:0;background:#3b82f6;transform:scaleX(var(--progress,0));transform-origin:left center}
@media(hover:none){.drag-badge{display:none}}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.s7,.s5,.s4{grid-column:span 12}.th{margin-left:0}}

c.i.forEach(([n,v],k)=>{const L=C*v/tot,segment=el(s,"circle",{cx:85,cy:85,r:R,fill:"none",stroke:P[k],"stroke-width":22,"stroke-dasharray":reduced?`${Math.max(L-2,0)} ${C}`:`0 ${C}`,"stroke-dashoffset":-o,transform:"rotate(-90 85 85)",class:"donut-segment"});segment.style.setProperty("--circumference",C);segment.style.setProperty("--segment-length",Math.max(L-2,0));segment.style.setProperty("--donut-delay",`${k*140}ms`);o+=L;
box.lastChild.insertAdjacentHTML("beforeend",`<div><i style="background:${P[k]}"></i>${n}<b>${f(v,c.u,c.s)}</b></div>`)});
const total=el(s,"text",{x:85,y:84,"text-anchor":"middle","font-size":20,"font-weight":700,fill:"var(--ink)",class:"donut-total","data-final":f(tot,c.u,c.s)},reduced?f(tot,c.u,c.s):"0");if(!reduced)countUp(total,f(tot,c.u,c.s));el(s,"text",{x:85,y:102,"text-anchor":"middle","font-size":11,fill:"var(--mut)"},"Total")}
function render(i){const d=D[i];activeTab=i;rotationStarted=performance.now();document.querySelectorAll(".tab").forEach((b,j)=>b.classList.toggle("on",i==j));
const m=document.getElementById("m");
const oldCaption=document.getElementById("dashboard-caption");if(oldCaption)oldCaption.classList.add("is-changing");
m.className="view-enter dashboard-main";
m.innerHTML=`<div class="kpis">${d.k.map(([l,v,x,inv],k)=>`<div class="card k" style="--i:${k}"><span class="l"><i style="background:${P[k]}"></i>${l}</span><b class="k-count" data-final="${v}">${reduced?v:"0"}</b><span class="d ${(x>0)!=!!inv?"up":"dn"}">${x>0?"▲":"▼"} ${Math.abs(x)}% <span>vs last period</span></span></div>`).join("")}</div>
<div class="g"><div class="card s7"><h3>${d.line.t}</h3><svg id="c1"></svg></div>
<div class="card s5"><h3>${d.dn.t}</h3><div class="dn2" id="c2"></div></div>
<div class="card s4"><h3>${d.hb.t}</h3><div class="hb">${(mx=>d.hb.i.map(([n,v],k)=>`<div><span>${n}</span><span class="tr"><u data-width="${v/mx*100}" style="--target-width:${v/mx*100}%;background:${P[k]}"></u></span><b>${f(v,d.hb.u,d.hb.s)}</b></div>`).join(""))(Math.max(...d.hb.i.map(x=>x[1])))}</div></div>
<div class="card s4"><h3>${d.br.t}</h3><svg id="c3"></svg></div>
<div class="card s4"><h3>${d.gl.t}</h3><div class="gl">${d.gl.i.map(([n,v,p],k)=>`<div><p><b>${n}</b><span>${v} · ${p}%</span></p><span class="tr"><u data-width="${p}" style="--target-width:${p}%;background:${P[k+1]}"></u></span></div>`).join("")}</div></div></div>
<p class="note">Sample data for illustration. Hover chart points for values.</p><div class="dashboard-caption" id="dashboard-caption"><span class="caption-icon">↘</span><strong>${CAPTIONS[i][0]}</strong><span>${CAPTIONS[i][1]}</span></div><div class="dashboard-progress" id="dashboard-progress">${D.map((item,j)=>`<button class="progress-dot${j==i?" is-active":""}" data-index="${j}" aria-label="${item.n}" style="--progress:${j==i?(reduced?1:0):0}"></button>`).join("")}</div>`;
line(document.getElementById("c1"),d.line);donut(document.getElementById("c2"),d.dn);bars(document.getElementById("c3"),d.br);animateMetrics(m);waitFrame(()=>document.getElementById("dashboard-caption")?.classList.remove("is-changing"))}
const tb=document.getElementById("tabs");
D.forEach((d,i)=>{const b=document.createElement("button");b.className="tab";b.textContent=d.n;b.onclick=()=>switchTab(i);tb.appendChild(b)});
tb.tabIndex=0;
const m=document.getElementById("m");m.classList.add("dashboard-main");m.tabIndex=0;
let dragPointerId=null;
m.addEventListener("pointerenter",e=>{showBadge(e);if(e.pointerType!=="touch"&&!rotationPaused){rotationPaused=true;pauseStarted=performance.now()}});
m.addEventListener("pointermove",e=>{showBadge(e);if(dragStartX===null)return;dragDistance=e.clientX-dragStartX;if(Math.abs(dragDistance)>4)dragging=true;if(dragging){m.style.transform=`translateX(${dragDistance*.3}px)`;badge.classList.add("is-dragging")}});
m.addEventListener("pointerleave",()=>{hideBadge();if(!dragging&&rotationPaused){rotationPaused=false;rotationStarted+=performance.now()-pauseStarted}});
m.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;dragStartX=e.clientX;dragDistance=0;dragging=false;dragPointerId=e.pointerId;m.setPointerCapture?.(e.pointerId);m.classList.add("is-dragging");badge.classList.add("is-dragging")});
const endDrag=e=>{if(dragStartX===null||e.pointerId!==dragPointerId)return;const distance=dragDistance;dragStartX=null;dragPointerId=null;dragging=false;m.classList.remove("is-dragging");badge.classList.remove("is-dragging");m.style.transform="";if(Math.abs(distance)>60)switchTab(activeTab+(distance<0?1:-1));if(!m.matches(":hover"))hideBadge()};
m.addEventListener("pointerup",endDrag);m.addEventListener("pointercancel",endDrag);
let trackpadDistance=0,trackpadReset;
m.addEventListener("wheel",e=>{if(rotationPaused&&!dragging){rotationPaused=false;rotationStarted+=performance.now()-pauseStarted}const horizontal=Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>1;if(!horizontal)return;trackpadDistance+=e.deltaX;clearTimeout(trackpadReset);trackpadReset=setTimeout(()=>{trackpadDistance=0},180);if(Math.abs(trackpadDistance)>=60){const direction=trackpadDistance>0?1:-1;trackpadDistance=0;switchTab(activeTab+direction);e.preventDefault()}},{passive:false});
m.addEventListener("pointerover",e=>{if(e.pointerType!=="touch"&&!dragging&&e.target.closest(".chart-point"))showBadge(e)});
document.addEventListener("keydown",e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;const focused=document.activeElement===m||m.contains(document.activeElement)||document.activeElement===tb||tb.contains(document.activeElement);if(!focused)return;e.preventDefault();switchTab(activeTab+(e.key==="ArrowRight"?1:-1))});
document.getElementById("th").onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dk?"light":"dark"};
render(0);
m.addEventListener("click",e=>{const dot=e.target.closest(".progress-dot");if(dot)switchTab(Number(dot.dataset.index))});
setInterval(()=>{if(rotationPaused||dragging)return;updateProgress()},50);
</script></body></html>
